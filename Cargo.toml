[workspace]
members = ["panic-example-test"]
default-members = [".", "panic-example-test"]

[package]
name = "descriptive-unwrap"
description = "Replacements for unwrap() that clarify the specific purpose, and format errors better."
version = "0.1.0"
edition = "2021" # latest edition available in 1.83
rust-version = "1.83" # we need const unwrap()
repository = "https://github.com/kpreid/descriptive-unwrap/"
license = "MIT OR Apache-2.0"
categories = ["rust-patterns", "no-std"]
keywords = ["unwrap", "expect", "error", "error-handling"]
publish = true
exclude = ["/.github"]

[lib]
test = false # non-doc tests are external

[dependencies]
